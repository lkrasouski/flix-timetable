[versions]
kotlin = "2.4.20"
agp = "9.3.3"
compileSdk = "37"
minSdk = "26"
targetSdk = "37"

compose-bom = "2026.09.00"
lifecycle = "2.11.0"
activity-compose = "1.13.0"
core-ktx = "1.19.1"
splashscreen = "1.2.0"

koin = "4.2.2"
