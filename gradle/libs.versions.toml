coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
kermit = "2.2.0"

turbine = "1.2.1"
junit = "4.13.2"
robolectric = "4.17"
ktlint-gradle = "14.2.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
